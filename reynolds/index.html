mTitle:{zh:'认知雷诺数',en:'Cognitive Reynolds Number'},
mSub:{zh:'媒介场景的每周自评与跟踪 · '+APP_VERSION,en:'Weekly self-assessment of media scenarios · '+APP_VERSION},
mDemo:{zh:'本工具处于概念开发阶段（Demo V1.0），参数与规则仍在演进；欢迎将使用意见反馈至 theclockroom@139.com。',en:'This tool is in its concept-development stage (Demo V1.0); parameters and rules are still evolving. Feedback welcome: theclockroom@139.com.'},
mIntro1:{zh:'这是一份把媒介素养落到可勾选维度的每周自查：<b>不停留在"要批判性地看信息"的一般号召，而是每周花几分钟，记录你在各个媒介场景里的暴露、控制、核查与欠账情况</b>，并连续跟踪它的变化。',en:'A weekly self-check that turns media literacy into checkable dimensions: <b>not a general call to "consume information critically", but a few minutes each week recording your exposure, control, verification and debt across media scenarios</b>, tracked over time.'},
mIntro2:{zh:'方法借自书稿第七章"认知雷诺数的费米估算"的思路：不做精确测量，只比较量级与方向——<i>模糊的正确好过精确的错误</i>。',en:'The method follows Chapter 7 of the book, "Fermi estimation of the cognitive Reynolds number": no precise measurement, only magnitudes and direction — <i>better vaguely right than exactly wrong</i>.'},
mRatioH:{zh:'核心比值：1 是边界',en:'The core ratio: 1 is the boundary'},
mRatioP1:{zh:'对一个媒介场景，比较两个时间：',en:'For each media scenario, compare two times:'},
mRatioNum:{zh:'<b>分子</b>：这段时间内到达的、需要核实的内容，认真过一遍（通读＋核查）所需的工时；',en:'<b>Numerator</b>: the hours needed to work carefully through (read + verify) the content arriving in that time;'},
mRatioDen:{zh:'<b>分母</b>：这段时间本身。',en:'<b>Denominator</b>: the time itself.'},
mRatioP2:{zh:'比值大于 1，意味着到达超出了"边看边审"的同步能力：一部分内容要么未经核查就被采信，要么递延成"认知欠账"。',en:'A ratio above 1 means arrival exceeds the capacity to audit while using: some content is either adopted unverified or deferred as cognitive debt.'},
mRatioEx:{zh:'例：一小时讲解类短视频（带货引流、匿名账号），其内容认真过一遍按论文演示算例约需 90 余小时——绝大多数只能被跳过或欠下。',en:'Example: one hour of promotion-style short video from anonymous accounts needs, by the paper\'s worked example, roughly 90+ hours to work through — almost all of it gets skipped or owed.'},
mRatioTwo:{zh:'自本版起短视频与 AI 采用<b>两摊结构</b>：λ＝通读摊（文本量÷阅读速率）＋核摊（命题数×还原参照×责任者系数÷阅读速率）。速率与参照随界面语言（中文 320 字/分；英语 238 词/分）。',en:'From this version on, short video and AI use a <b>two-component structure</b>: λ = reading component (text volume ÷ reading rate) + verification component (propositions × restoration reference × responsibility coefficient ÷ reading rate). Rate and references follow the UI language (Chinese 320 chars/min; English 238 wpm).'},
mFormH:{zh:'媒介的差异在形式，不在内容',en:'Media differ in form, not content'},
mFormP:{zh:'书籍由你定节奏，可停、可回看；短视频由算法定节奏，自动播放、无限滚动；AI 的生成量不受你的阅读速度封顶。<b>"节奏由谁设定"本身就是控制权的差异。</b>',en:'Books set their own pace — pausable, re-readable; short video is paced by algorithms — autoplay, infinite scroll; AI generation is not capped by your reading speed. <b>Who sets the pace is itself a difference of control.</b>'},
mFormTh1:{zh:'区间',en:'Interval'},mFormTh2:{zh:'代表场景',en:'Scenarios'},mFormTh3:{zh:'特征',en:'Features'},
mFormL:{zh:'你定节奏；能停下来、能回看',en:'You set the pace; can stop and re-read'},
mFormT:{zh:'部分节奏交给平台；停止信号开始被削弱',en:'Some pace ceded to platforms; stop signals eroding'},
mFormB:{zh:'自动播放与无限滚动消除停止信号；验证窗口被压到秒级；AI 场景生成量持续增长，默认采信可能抑制核查启动（机制假说）',en:'Autoplay and infinite scroll remove stop signals; verification windows compressed to seconds; AI generation keeps growing and default acceptance may suppress checking (mechanism hypothesis)'},
mFourH:{zh:'每周只问四件事',en:'Four questions each week'},

mReadH:{zh:'怎么读结果',en:'How to read results'},
mRead1:{zh:'只看方向与量级，不比精确倍数；场景之间不合成统一数值轴。每周有一个<b>总判读</b>（层流型／过渡型／湍流型），它按债务轨迹作序数分型，不是把各场景折算成的分数。',en:'Read direction and magnitude only; scenarios are not merged onto one numeric axis. Each week gets an <b>overall reading</b> (laminar / transitional / turbulent) — an ordinal typing by debt trajectory, not a score.'},
mRead2:{zh:'每个场景的"每小时待审工时 λ"是明示的情景参数（见下表），不是平台实测；换一组合理参数、结论方向不变的，才是稳的判断。',en:'Each scenario\'s λ (audit hours per hour of use) is an explicit scenario parameter (see table), not a platform measurement; robust judgments survive parameter changes.'},

mTrackP:{zh:'每周填一次（建议周日晚上）。结果页给出本周总判读与待审工时瀑布图，并自动与上一周比较；"跟踪"页有逐周总览的堆积柱状图和跨周场景状态矩阵——观察的是<b>状态与颜色的变化方向</b>，不是分数的涨跌。',en:'Fill once a week (Sunday evening recommended). The result page shows the weekly reading and an audit-hours waterfall, auto-compared with last week; the Track page stacks weeks and cross-week scenario states — watch <b>the direction of states and colors</b>, not score ups and downs.'},

/* ===== 周总判读与图表 ===== */
/* 周总判读：按论文 §7 债务轨迹分型作序数判断——
   任一场景"已入下游"→湍流型；否则"说不清"过半→说不清；
   任一场景"在积累"→过渡型；否则层流型。比值只作辅助数字，不参与分型。 */
function weeklyType(d){
  if(!d.rows.length)return 'unclear';
  if(d.rows.some(r=>r.status==='downstream'))return 'turb';
  const u=d.rows.filter(r=>r.status==='unclear').length;
  if(u>=Math.ceil(d.rows.length/2))return 'unclear';
  if(d.rows.some(r=>r.status==='accumulating'))return 'trans';
  return 'lami';
}
function waterfallHTML(d){
  const rows=d.rows;
  if(!rows.length)return '';
  const total=d.tot.auditMid;
  const maxV=Math.max(total,d.tot.hrs,1)*1.08;
  const n=rows.length,colW=100/(n+1);
  let cum=0,bars='',labels='';
  rows.forEach((r,i)=>{
    const b=cum/maxV*100,h=r.audit.mid/maxV*100;
    bars+='<div class="wf-bar" style="left:'+(i*colW+colW*.2)+'%;width:'+(colW*.6)+'%;bottom:'+b+'%;height:'+h+'%;background:'+STATUS_COLOR[r.status]+'"><span class="wf-val">'+fmtH(r.audit.mid)+'</span></div>';
    if(i<n-1)bars+='<div class="wf-conn" style="left:'+(i*colW+colW*.8)+'%;width:'+(colW*.4)+'%;bottom:'+((cum+r.audit.mid)/maxV*100)+'%"></div>';
    cum+=r.audit.mid;
    labels+='<div class="wf-lab" style="width:'+colW+'%"><i style="background:'+STATUS_COLOR[r.status]+'"></i>'+lb(SHORT[r.key]||r.name)+'</div>';
  });
  const wt=weeklyType(d),wm=WTYPE_META[wt];
  bars+='<div class="wf-bar" style="left:'+(n*colW+colW*.2)+'%;width:'+(colW*.6)+'%;bottom:0;height:'+(total/maxV*100)+'%;background:'+wm.color+'"><span class="wf-val">'+fmtH(total)+'</span></div>';
  labels+='<div class="wf-lab" style="width:'+colW+'%"><i style="background:'+wm.color+'"></i>'+t('wfTotal')+'</div>';
  const ref='<div class="wf-ref" style="bottom:'+(d.tot.hrs/maxV*100)+'%"><span>'+t('wfRefLab')+fmtH(d.tot.hrs)+'h</span></div>';
  const legend='<div class="legend">'+Object.keys(STATUS_META).map(k=>'<span><i class="sw" style="background:'+STATUS_COLOR[k]+'"></i>'+lb(STATUS_META[k].label)+'</span>').join('')+'</div>';
  return '<div class="wf-title">'+t('wfTitle')+'</div>'+
  '<p class="sub" style="margin:.1em 0 .2em">'+t('wfSub')+'</p>'+
  '<div class="wf"><div class="wf-plot">'+bars+ref+'</div><div class="wf-labs">'+labels+'</div></div>'+legend;
}
function weeksChartHTML(){
  if(store.records.length<2)return '';
  const weeks=store.records.map(r=>({r,d:deriveRecord(r)}));
  const maxV=Math.max(1,...weeks.map(w=>Math.max(w.d.tot.auditMid,w.d.tot.hrs)))*1.08;
  const cw=100/weeks.length;
  const idx={};SCENARIOS.forEach((s,i)=>{idx[s.key]=i;});
  let cols='',labs='';
  weeks.forEach((w,i)=>{
    const rows=w.d.rows.slice().sort((a,b)=>idx[a.key]-idx[b.key]);
    let cum=0,segs='';
    rows.forEach(r=>{
      segs+='<div class="wk-seg" style="bottom:'+(cum/maxV*100)+'%;height:'+(r.audit.mid/maxV*100)+'%;background:'+STATUS_COLOR[r.status]+'" title="'+r.name+'：'+lb(STATUS_META[r.status].label)+'"></div>';
      cum+=r.audit.mid;
    });
    const wt=weeklyType(w.d),wm=WTYPE_META[wt];
    cols+='<div class="wk-col" style="left:'+(i*cw+cw*.22)+'%;width:'+(cw*.56)+'%">'+segs+
    '<div class="wk-ref" style="bottom:'+(w.d.tot.hrs/maxV*100)+'%" title="'+t('wfRefLab')+fmtH(w.d.tot.hrs)+'h"></div>'+
    '<div class="wk-val" style="color:'+wm.color+'">'+fmtH(w.d.tot.auditMid)+'</div></div>';
    labs+='<div class="wf-lab" style="width:'+cw+'%"><i style="background:'+wm.color+'"></i>'+lb(wm.label)+'<br><span>'+wkShort(w.r.weekMonday)+' · '+fmtH(w.d.tot.hrs)+'h</span></div>';
  });
  const legend='<div class="legend">'+Object.keys(STATUS_META).map(k=>'<span><i class="sw" style="background:'+STATUS_COLOR[k]+'"></i>'+lb(STATUS_META[k].label)+'</span>').join('')+
  '<span><i class="sw" style="height:0;border-top:2px dashed var(--acc);background:none"></i>'+t('wfRefLab').replace(/ $/,'')+'</span></div>';
  let divLines='';
  for(let i=0;i<weeks.length-1;i++){
    if(weeks[i].d.isV1!==weeks[i+1].d.isV1){
      const x=(i+1)*cw;
      divLines+='<div style="position:absolute;top:0;bottom:0;left:'+x+'%;width:0;border-left:2px dashed var(--dim);z-index:6"></div>'+
      '<span style="position:absolute;top:2px;left:'+(x+0.4)+'%;font-size:10px;color:var(--dim);background:rgba(244,245,247,.9);padding:0 3px;z-index:7" title="'+(lang==='zh'?'此线两侧规则版本不同，柱高不直接可比':'different rules versions on the two sides; bar heights not directly comparable')+'">v'+(weeks[i].d.isV1?'1|2':'2|1')+'</span>';
    }
  }
  return '<div class="card"><h3>'+t('wkTitle')+'</h3>'+
  '<div class="tw"><div style="min-width:440px">'+
  '<div class="wf"><div class="wf-plot" style="height:200px">'+cols+divLines+'</div><div class="wf-labs">'+labs+'</div></div>'+legend+
  '</div></div>'+
  '<p class="sub">'+t('wkSub')+'</p></div>';
}

const $=s=>document.querySelector(s);
function labelOf(opts,v){const o=opts.find(x=>x.v===v);return o?lb(o.label):'—';}
function fmtH(h){if(!isFinite(h))return '—';if(h>=10)return String(Math.round(h));const r=Math.round(h*10)/10;return r%1===0?String(r):r.toFixed(1);}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function parseMonday(s){return new Date(s+'T00:00:00');}
function isoDate(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function fmtDate(d){return lang==='zh'?((d.getMonth()+1)+'月'+d.getDate()+'日'):((d.getMonth()+1)+'/'+d.getDate());}
function weekRange(mon){const end=new Date(mon);end.setDate(end.getDate()+6);return fmtDate(mon)+'–'+fmtDate(end);}
function isoWeekNum(mon){const t=new Date(mon);t.setDate(t.getDate()+3);const y=t.getFullYear();const j4=new Date(y,0,4);const dj=(j4.getDay()+6)%7;return 1+Math.round(((t-j4)/86400000-3+dj)/7);}
function isoWeekOf(mon){const t=new Date(mon);t.setDate(t.getDate()+3);return lang==='zh'?(t.getFullYear()+' 年第 '+isoWeekNum(mon)+' 周'):('W'+isoWeekNum(mon)+' '+t.getFullYear());}
function wkShort(w){return lang==='zh'?('第'+isoWeekNum(parseMonday(w))+'周'):('W'+isoWeekNum(parseMonday(w)));}
function recentMondays(n){const cur=mondayOf(new Date());const out=[];for(let i=n-1;i>=0;i--){const d=new Date(cur);d.setDate(d.getDate()-7*i);out.push(d);}return out;}
function zoneCls(z){if(z==='lami')return 'z-ok';if(z.indexOf('turb')===0)return 'z-bad';return 'z-mid';}
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
/* ===== 存储（独立键 cognoweek_v2，与旧键 cognoweek_v1 隔离）===== */
const LS_KEY='cognoweek_v2';
let memStore=null;
function loadStore(){
  try{const s=localStorage.getItem(LS_KEY);if(!s)return{records:[]};const o=JSON.parse(s);return{records:Array.isArray(o.records)?o.records:[]};}
  catch(e){if(!memStore)memStore={records:[]};return memStore;}
}
function saveStore(st){
  try{localStorage.setItem(LS_KEY,JSON.stringify({app:'cognoweek',schemaVersion:1,records:st.records}));}
  catch(e){memStore=st;}
}
let store=loadStore();
/* ===== 推导（rulesVersion=2：两摊公式；v1 记录按 v1 快照解读）===== */
function lamV2(key,a,lg){
  const rl=lg||lang;
  const L=LANG_RATE[rl];
  if(key==='shortvideo'){
    const tr=CAL.svTrans[rl]||200;
    const ref=L.ref[a.ctype]||L.ref.natural;
    const co=CAL.respCoeff[a.resp]||CAL.respCoeff.signed;
    const out={};
    ['lo','mid','hi'].forEach(k=>{
      const n=CAL.svPerHour[k];
      out[k]=+((n*tr+n*CAL.svProps*ref*co)/L.hourly).toFixed(4);
    });
    const m=CAL.svPerHour.mid;
    out.wa=+((m*tr)/L.hourly).toFixed(4);
    out.wb=+((m*CAL.svProps*ref*co)/L.hourly).toFixed(4);
    return out;
  }
  if(key==='ai'){
    const sub=a.subtype||'mid';
    const wa=CAL.aiReadComp[sub];
    const ref=L.ref[a.ctype]||L.ref.natural;
    const co=CAL.respCoeff[a.resp]||CAL.respCoeff.signed;
    const base=CAL.aiProps[sub]*ref*co/L.hourly;
    return {lo:+(wa*0.8+base*0.5).toFixed(4),mid:+(wa+base).toFixed(4),hi:+(wa*1.25+base*2).toFixed(4),wa:+wa.toFixed(4),wb:+base.toFixed(4)};
  }
  return null;
}
function lambdaOf(key,a,isV1,lg){
  const s=SC[key];
  if(isV1){
    if(key==='shortvideo')return V1_LAM.shortvideo[a.subtype]||V1_LAM.shortvideo.talk;
    if(key==='ai')return V1_LAM.ai[a.subtype]||V1_LAM.ai.mid;
  }else{
    const f=lamV2(key,a,lg);
    if(f)return f;
  }
  if(s.sub){const o=s.sub.find(x=>x.v===a.subtype)||s.sub[0];return o.lam||{lo:1,mid:1,hi:1};}
  return s.lam;
}
function scenarioStatus(a){
  const u=[a.stop,a.check,a.debt].filter(v=>v==='unclear').length;
  if(a.debt==='major')return 'downstream';
  if(u>=2)return 'unclear';
  if(a.debt==='some'||a.stop==='no'||a.check==='never')return 'accumulating';
  if(a.check==='no-adopt')return 'noadopt';
  return 'steady';
}
function deriveRecord(rec){
  const isV1=(rec.rulesVersion||1)<2;
  const recLang=(!isV1&&rec.lang)?rec.lang:lang; // v2 记录按作答语言解读
  const rows=SCENARIOS.filter(s=>rec.scenarios[s.key]).map(s=>{
    const a=rec.scenarios[s.key];
    const hrs=HOURS_MID[a.hours]*7;
    const lam=lambdaOf(s.key,a,isV1,recLang);
    const audit={lo:hrs*lam.lo,mid:hrs*lam.mid,hi:hrs*lam.hi};
    return{key:s.key,name:lb(s.name),zone:s.zone,ex:lb(s.ex),hrs,hrsLabel:lb(HOURS_LABEL[a.hours]||{zh:'—',en:'—'}),lam,audit,status:scenarioStatus(a),a,src:lb(s.src),two:!!s.formula&&!isV1};
  });
  rows.sort((x,y)=>y.audit.mid-x.audit.mid);
  const tot={hrs:rows.reduce((t,r)=>t+r.hrs,0),auditLo:rows.reduce((t,r)=>t+r.audit.lo,0),auditMid:rows.reduce((t,r)=>t+r.audit.mid,0),auditHi:rows.reduce((t,r)=>t+r.audit.hi,0)};
  const checkT=CHECKTIME_OPTS.find(o=>o.v===rec.general.checktime);
  const acc=rows.filter(r=>r.status==='accumulating');
  const down=rows.filter(r=>r.status==='downstream');
  return{rows,tot,checkT,acc,down,isV1};
}
function nextAction(rec,d){
  if(d.down.length)return t('n1a')+d.down[0].name+t('n1b');
  const ns=d.rows.filter(r=>r.a.stop==='no')[0];
  if(ns)return t('n2a')+ns.name+t('n2b');
  const nv=d.rows.find(r=>r.a.check==='never');
  if(nv)return t('n3');
  if(rec.general.checktime==='none')return t('n4');
  if(d.rows.length&&d.rows.every(r=>['unclear','noadopt'].indexOf(r.status)>=0))return t('n5');
  return t('n6');
}
function summaryLines(rec,d){
  const L=[];
  L.push(t('s1')+d.rows.length+t('s1b')+fmtH(d.tot.hrs)+t('s1c')+fmtH(d.tot.auditMid)+t('s1d')+fmtH(d.tot.auditLo)+'–'+fmtH(d.tot.auditHi)+t('s1e'));
  if(d.rows[0])L.push(t('s2a')+d.rows[0].name+t('s2b')+fmtH(d.rows[0].hrs)+t('s2c')+fmtH(d.rows[0].audit.mid)+t('s2d'));
  if(d.down.length)L.push(t('s3down')+d.down.map(r=>r.name).join(lang==='zh'?'、':', ')+t('s3down2'));
  else if(d.acc.length)L.push(d.acc.length+t('s3acc'));
  else if(d.rows.length)L.push(t('s3sync'));
  const g=rec.general;
  if(g.unstoppable&&g.unstoppable!=='no')L.push(t('s4a')+labelOf(UNSTOP_OPTS,g.unstoppable)+t('s4b'));
  const imap={yes:t('s5yes'),part:t('s5part'),off:t('s5off'),unclear:t('s5unc')};
  L.push(t('s5pre')+(imap[g.intention]||t('s5unc'))+(lang==='zh'?'。':'.'));
  L.push(t('s6a')+(d.checkT?fmtH(d.checkT.mid):'0')+t('s6b'));
  return L;
}
function comparisonLines(prev,cur){
  const lines=[];
  const dPrev=deriveRecord(prev);
  lines.push(lang==='zh'?'使用总时长：约 ':'Total use: about '+fmtH(dPrev.tot.hrs)+(lang==='zh'?' → 约 ':' → about ')+fmtH(deriveRecord(cur).tot.hrs)+(lang==='zh'?' 小时':' h'));
  SCENARIOS.forEach(s=>{
    const k=s.key,p=prev.scenarios[k],c=cur.scenarios[k];
    if(p&&c){
      const pi=HOURS_OPTS.findIndex(o=>o.v===p.hours),ci=HOURS_OPTS.findIndex(o=>o.v===c.hours);
      const arr=ci>pi?' ↑':ci<pi?' ↓':' →';
      const ps=lb(STATUS_META[scenarioStatus(p)].label),cs=lb(STATUS_META[scenarioStatus(c)].label);
      lines.push(lb(s.name)+'：'+lb(HOURS_LABEL[p.hours]||{zh:'—',en:'—'})+' → '+lb(HOURS_LABEL[c.hours]||{zh:'—',en:'—'})+arr+'；'+(ps===cs?ps:ps+' → '+cs));
    }else if(c){lines.push((lang==='zh'?'新增：':'New: ')+lb(s.name)+'（'+lb(HOURS_LABEL[c.hours]||{zh:'—',en:'—'})+'）');}
    else if(p){lines.push((lang==='zh'?'本周未用：':'Unused this week: ')+lb(s.name));}
  });
  return lines;
}

  let md='# '+(Z?'认知周报 ':'Cognitive Weekly ')+wkId(rec.weekMonday)+'（'+weekRange(mon)+'）\n\n';
  md+='- '+(Z?'总判读':'Overall reading')+': **'+lb(wm.label)+'**（'+lb(wm.desc)+'）\n';
  md+='- '+(Z?'使用总时长':'Total use')+': '+fmtH(d.tot.hrs)+' h | '+(Z?'待审工时估算':'Audit-hours estimate')+': '+fmtH(d.tot.auditMid)+' h ('+fmtH(d.tot.auditLo)+'–'+fmtH(d.tot.auditHi)+') | '+(Z?'额外核查':'Extra verification')+': '+(d.checkT?fmtH(d.checkT.mid):'0')+' h\n';
  md+='- '+(Z?'待审／使用 ≈ ':'audit/use ≈ ')+ratio+'×'+(Z?'（情景估算；速率 ':' (scenario estimate; rate ')+(LANG_RATE[rl].label[rl]||LANG_RATE[rl].label.zh)+')\n';
  md+='- rulesVersion: '+(rec.rulesVersion||1)+(d.isV1?(Z?'（本记录按 v1 草案口径解读）':' (interpreted under v1 draft)'):'')+'\n\n';
  if(d.isV1){
    md+='## '+(Z?'场景':'Scenarios')+'\n\n| '+(Z?'场景|时长档|周小时|λ|待审(区间)|停|核查|债务|状态':'Scenario|Time tier|Week h|λ|Audit(range)|Stop|Verified|Debt|Status')+' |\n|---|---|---|---|---|---|---|---|---|\n';
    d.rows.forEach(r=>{
      const sub=r.a.subtype?((SC[r.key].sub||[]).find(x=>x.v===r.a.subtype)||{label:{zh:'',en:''}}).label:'';
      md+='| '+r.name+(sub?'（'+lb(sub)+'）':'')+' | '+r.hrsLabel+' | '+fmtH(r.hrs)+' | '+r.lam.mid+' | '+fmtH(r.audit.mid)+'（'+fmtH(r.audit.lo)+'–'+fmtH(r.audit.hi)+'） | '+labelOf(STOP_OPTS,r.a.stop)+' | '+labelOf(CHECK_OPTS,r.a.check)+' | '+labelOf(DEBT_OPTS,r.a.debt)+' | '+lb(STATUS_META[r.status].label)+' |\n';
    });
  }else{
    md+='## '+(Z?'场景':'Scenarios')+'\n\n| '+(Z?'场景|时长档|周小时|内容|责任者|λ(通读+核摊)|待审(区间)|停|核查|债务|状态':'Scenario|Time tier|Week h|Content|Party|λ(read+verify)|Audit(range)|Stop|Verified|Debt|Status')+' |\n|---|---|---|---|---|---|---|---|---|---|---|\n';
    d.rows.forEach(r=>{
      md+='| '+r.name+' | '+r.hrsLabel+' | '+fmtH(r.hrs)+' | '+(r.two?labelOf(CTYPE_OPTS,r.a.ctype):'—')+' | '+(r.two?labelOf(RESP_OPTS,r.a.resp):'—')+' | '+r.lam.mid+(r.two&&r.lam.wa!==undefined?(' ('+r.lam.wa+'+'+r.lam.wb+')'):'')+' | '+fmtH(r.audit.mid)+'（'+fmtH(r.audit.lo)+'–'+fmtH(r.audit.hi)+'） | '+labelOf(STOP_OPTS,r.a.stop)+' | '+labelOf(CHECK_OPTS,r.a.check)+' | '+labelOf(DEBT_OPTS,r.a.debt)+' | '+lb(STATUS_META[r.status].label)+' |\n';
    });
  }
  md+='\n## '+(Z?'速写':'Sketch')+'\n\n'+summaryLines(rec,d).map(s=>'- '+s).join('\n')+'\n\n';
  md+='## '+(Z?'下一步':'Next')+'\n\n'+nextAction(rec,d)+'\n';
  md+='\n## '+(Z?'原始记录（机器可读，可用于恢复）':'Raw record (machine-readable, for restore)')+'\n\n```json\n'+JSON.stringify(rec,null,2)+'\n```\n';
  return md;
}
function exportJournal(rec){
  const blob=new Blob([journalMarkdown(rec)],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=wkId(rec.weekMonday)+'.md';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(t('dMdExported')+wkId(rec.weekMonday)+'.md'+t('dMdExported2'));
}
/* ===== 跟踪页 ===== */
function renderTrack(){
  const c=$('#page-track');
  if(!store.records.length){
    c.innerHTML='<div class="card empty"><h2>'+t('tEmptyH')+'</h2><p>'+t('tEmptyP')+'</p></div>';
    return;
  }
  const recs=[...store.records].reverse();
  const cards=recs.map(r=>{
    const d=deriveRecord(r),mon=parseMonday(r.weekMonday),wt=weeklyType(d);
    const strip=d.rows.map(x=>{const st=STATUS_META[x.status];
      return '<span class="si">'+x.name+'<b class="'+x.status+'">'+st.sym+'</b></span>';}).join('');
    return '<div class="card">'+
    '<div class="stephead">'+isoWeekOf(mon)+' · '+weekRange(mon)+'</div>'+
    '<div class="trow">'+d.rows.length+t('tRowLine')+fmtH(d.tot.hrs)+t('tRowLine2')+fmtH(d.tot.auditMid)+t('tRowLine3')+'<b style="color:'+WTYPE_META[wt].color+'">'+lb(WTYPE_META[wt].label)+'</b></div>'+
    '<div class="strip">'+strip+'</div>'+
    '<div class="navrow"><span></span><span>'+
    '<button class="btn ghost sm" data-view="'+r.weekMonday+'">'+t('tView')+'</button> '+
    '<button class="btn ghost sm" data-edit="'+r.weekMonday+'">'+t('tEdit')+'</button></span></div></div>';
  }).join('');
  const chart=weeksChartHTML();
  let matrix='';
  if(store.records.length>=2){
    const weeks=store.records.map(r=>r.weekMonday);
    const keys=SCENARIOS.map(s=>s.key).filter(k=>store.records.some(r=>r.scenarios[k]));
    const head=weeks.map(w=>'<th>'+wkShort(w)+'</th>').join('');
    const body=keys.map(k=>{
      const cells=weeks.map(w=>{
        const a=store.records.find(r=>r.weekMonday===w).scenarios[k];
        if(!a)return '<td style="color:var(--dim)">·</td>';
        const stt=scenarioStatus(a),st=STATUS_META[stt],hrs=HOURS_MID[a.hours]*7;
        return '<td><b class="'+stt+'" title="'+fmtH(hrs)+' h · '+lb(st.label)+'">'+st.sym+'</b></td>';
      }).join('');
      return '<tr><td class="sct">'+lb(SC[k].name)+'</td>'+cells+'</tr>';
    }).join('');
    matrix='<div class="card"><h3>'+t('tMatrixH')+'</h3>'+
    '<div class="legend">'+Object.keys(STATUS_META).map(k=>'<span><b class="'+k+'">'+STATUS_META[k].sym+'</b> '+lb(STATUS_META[k].label)+'</span>').join('')+'<span><b>·</b> '+t('tUnused')+'</span></div>'+
    '<div class="tw"><table><thead><tr><th></th>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="sub">'+t('tMatrixSub')+'</p></div>';
  }
  c.innerHTML=chart+cards+matrix;
  c.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
    currentRecord=store.records.find(r=>r.weekMonday===b.dataset.view);go('result');});
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    startSurvey(store.records.find(r=>r.weekMonday===b.dataset.edit));});
}
/* ===== 数据页 ===== */
function renderData(){
  const c=$('#page-data');
  const n=store.records.length;
  let size='?';
  try{size=(localStorage.getItem(LS_KEY)||'').length;}catch(e){}
  c.innerHTML='<div class="card"><h3>'+t('dTitle')+'</h3>'+
  '<p class="sub">'+n+t('dSub')+(size==='?'?size:(Math.round(size/1024)+' KB'))+'。</p>'+
  '<div class="navrow" style="justify-content:flex-start">'+
  '<button class="btn sm" id="btn-export">'+t('dExport')+'</button>'+
  '<label class="btn ghost sm" style="display:inline-block;cursor:pointer">'+t('dImport')+'<input type="file" id="file-import" accept=".json,application/json" style="display:none"></label>'+
  '<button class="btn ghost sm" id="btn-clear">'+t('dClear')+'</button></div>'+
  '<p class="sub" style="margin-top:12px">'+lb(APP_NAME)+' '+APP_VERSION+' · '+t('dRules')+' 2 · '+lb(RIGHTS)+'</p></div>';
  $('#btn-export').onclick=exportData;
  $('#file-import').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
  $('#btn-clear').onclick=()=>{
    if(confirm(t('dClear1'))&&confirm(t('dClear2'))){
      store={records:[]};saveStore(store);currentRecord=null;toast(t('toastCleared'));go('track');
    }
  };
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'cognoweek',schemaVersion:1,exportedAt:new Date().toISOString(),records:store.records},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(lang==='zh'?'认知雷诺数_导出_':'cognoweek_export_')+isoDate(new Date()).replace(/-/g,'')+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(t('dExported')+store.records.length+t('dExported2'));
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      const arr=Array.isArray(o)?o:(Array.isArray(o.records)?o.records:null);
      if(!arr)throw new Error('bad');
      let n=0,skip=0;
      arr.forEach(x=>{
        if(x&&typeof x.weekMonday==='string'&&x.scenarios&&x.general){
          const i=store.records.findIndex(r2=>r2.weekMonday===x.weekMonday);
          if(i>=0)store.records[i]=x;else store.records.push(x);n++;
        }else skip++;
      });
      store.records.sort((a,b)=>a.weekMonday<b.weekMonday?-1:1);
      saveStore(store);
      currentRecord=store.records[store.records.length-1]||null;
      toast(t('dImported')+n+t('dImported2')+(skip?(t('dImported3')+skip+t('dImported4')):''));
      go('track');
    }catch(e){toast(t('dImportFail'));}
  };
  r.readAsText(file,'utf-8');
}

/* ===== 导航与初始化 ===== */
function go(name){
  curPage=name;
  ['method','survey','result','track','data'].forEach(n=>{
    const p=$('#page-'+n),tt=$('#tab-'+n);
    if(p)p.classList.toggle('active',n===name);
    if(tt)tt.classList.toggle('on',n===name);
  });
  if(name==='survey')renderSurvey();
  if(name==='result')renderResult(currentRecord);
  if(name==='track')renderTrack();
  if(name==='data')renderData();
  window.scrollTo(0,0);
}
function applyStaticText(){
  $('#tab-method').textContent=t('tabMethod');
  $('#tab-survey').textContent=t('tabSurvey');
  $('#tab-result').textContent=t('tabResult');
  $('#tab-track').textContent=t('tabTrack');
  $('#tab-data').textContent=t('tabData');
  $('#btn-lang').textContent=t('langBtn');
  $('#gate-head').textContent=t('gateHead');
  $('#gate-title').textContent=t('gateTitle');
  $('#gate-decline').textContent=t('gateDecline');
  $('#gate-accept').textContent=t('gateAccept');
}
document.addEventListener('click',e=>{
  const ch=e.target.closest('.chip');
  if(!ch)return;
  const box=ch.closest('.chips');
  if(!box)return;
  const v=ch.dataset.v;
  if(box.dataset.k&&draft&&draft.answers[box.dataset.k]){draft.answers[box.dataset.k][box.dataset.q]=v;}
  else if(box.dataset.q&&draft&&draft.general){draft.general[box.dataset.q]=v;}
  else return;
  box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===ch));
});
['method','survey','result','track','data'].forEach(n=>{
  $('#tab-'+n).onclick=()=>go(n);
});
$('#btn-lang').onclick=()=>setLang(lang==='zh'?'en':'zh');
function initGate(){
  let agreed=false;
  try{agreed=!!localStorage.getItem(GATE_KEY);}catch(e){}
  $('#gate-disclaimer').innerHTML=disclaimerHTML();
  const g=$('#gate');
  if(!agreed)g.style.display='flex';
  $('#gate-accept').onclick=()=>{try{localStorage.setItem(GATE_KEY,'1');}catch(e){}g.style.display='none';};
  $('#gate-decline').onclick=()=>{
    $('#gate-inner').innerHTML='<h2>'+t('gateDeclined')+'</h2><p class="sub">'+t('gateDeclinedBody')+'</p>';
  };
}
document.documentElement.lang=(lang==='zh'?'zh-CN':'en');
applyStaticText();
initGate();
renderMethodPage();
currentRecord=store.records[store.records.length-1]||null;
go(store.records.length?'result':'method');
</script>
